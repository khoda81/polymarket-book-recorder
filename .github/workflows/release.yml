name: Release

# Every push to main is released and deployed.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # The VPS is arm64, so releases are built natively on an arm64 runner.
    runs-on: ubuntu-24.04-arm
    # Building on Debian 12 keeps the glibc floor at 2.36, so the binary runs
    # on Debian 12+ and Ubuntu 24.04+ hosts.
    container: rust:1-bookworm
    outputs:
      tag: ${{ steps.name.outputs.tag }}
      asset: ${{ steps.name.outputs.asset }}
    steps:
      - uses: actions/checkout@v4
      # Derived from the commit rather than the clock, so a re-run reuses the tag.
      - id: name
        env:
          COMMITTED_AT: ${{ github.event.head_commit.timestamp }}
        run: |
          tag="v$(date -u -d "$COMMITTED_AT" +%Y.%m.%d)-${GITHUB_SHA::7}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "asset=polymarket-book-recorder-$tag-aarch64-linux.tar.gz" >>"$GITHUB_OUTPUT"
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Package
        env:
          ASSET: ${{ steps.name.outputs.asset }}
        run: |
          tar -czf "$ASSET" -C target/release polymarket-book-recorder
          sha256sum "$ASSET" > "$ASSET.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ steps.name.outputs.asset }}*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          ASSET: ${{ needs.build.outputs.asset }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" "$ASSET.sha256" --target "$GITHUB_SHA" \
              --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

  deploy:
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-recorder
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          TAG: ${{ needs.build.outputs.tag }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST is not configured; release published without deploying."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          # TAG is meant to expand here, on the runner.
          # shellcheck disable=SC2029
          ssh "polyviz-deploy@$DEPLOY_HOST" recorder "$TAG"
